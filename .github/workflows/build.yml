name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/MagicCompanion.Tests/MagicCompanion.Tests.csproj -c Release --nologo
      - run: dotnet run --project tests/MagicCompanion.PlatformChecks -c Release
      - run: dotnet publish src/windows/MagicCompanion.Agent/MagicCompanion.Agent.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
        working-directory: src/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
